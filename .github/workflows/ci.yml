name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run core unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test
      - name: Run app unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  build:
    name: Build APKs (Gradle, AnkiDroid-style)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AnkiDroid-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AnkiDroid-release
          path: app/build/outputs/apk/release/*.apk

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: NEXUS-AnkiDroid-debug
          path: apks
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-alpha"
          gh release create "$TAG" apks/*.apk \
            --title "NEXUS-AnkiDroid v0.1.0-alpha" \
            --notes "First reproducible CI build (GitHub Actions, Gradle, AnkiDroid-style pipeline). Debug-signed release APK, directly installable. This app is an evidence-collection instrument: it makes NO claims that NEXUS-SCOPE improves learning. See README for the experiment protocol and the scientific-integrity statement." \
            || gh release upload "$TAG" apks/*.apk --clobber

  ci-token-layer-check:
    name: Verify NEXUS_CI_TOKEN layer
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PAT-based repository secret can read the repo
        env:
          GH_TOKEN: ${{ secrets.NEXUS_CI_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "User-Agent: nexus-ankidroid-ci" \
            https://api.github.com/repos/${{ github.repository }})
          echo "NEXUS_CI_TOKEN repo access: HTTP $code"
          test "$code" = "200"
